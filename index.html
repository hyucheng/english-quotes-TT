    // 简单的翻译函数
    function simpleTranslate(text) {
        const words = text.toLowerCase().split(/\s+/);
        const translatedWords = words.map(word => {
            // 移除标点符号
            const cleanWord = word.replace(/[.,!?;:"]/g, '');
            return translationDict[cleanWord] || word;
        });
        return translatedWords.join(' ');
    }
// 定义多个API端点，按顺序尝试
const apiEndpoints = [
    'https://api.quotable.io/random',
    'https://quotable.io/random',
    'https://zenquotes.io/api/random'
];
    // 内置备用名言数据
const fallbackQuotes = [
    {
        content: "The only way to do great work is to love what you do.",
        author: "Steve Jobs",
        translation: "做出伟大工作的唯一方法就是热爱你所做的事情。"
    },

        translation: "未来属于那些相信自己梦想之美的人。"

];
    // 获取名言函数
    async function getNewQuote() {
        const quoteContainer = document.getElementById('quoteContainer');
        const newQuoteBtn = document.getElementById('newQuoteBtn');
        
        // 显示加载状态
        quoteContainer.innerHTML = '<div class="loading">正在加载名言...</div>';
        newQuoteBtn.disabled = true;
        newQuoteBtn.textContent = '加载中...';

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 8000);

        try {
        // 按顺序尝试每个API端点
        let response;
        let success = false;
        let usedEndpoint = '';
        
        for (let endpoint of apiEndpoints) {
            try {
                console.log(`尝试API: ${endpoint}`);
                response = await fetch(endpoint, { 
                    signal: controller.signal,
                    mode: 'cors'
                });
                
                if (response.ok) {
                    success = true;
                    usedEndpoint = endpoint;
                    console.log(`API调用成功: ${endpoint}`);
                    break;
                }
            } catch (error) {
                console.log(`API ${endpoint} 失败:`, error.message);
                continue;
            }
        }

        clearTimeout(timeoutId);

        if (success && response) {
            const data = await response.json();
            
            // 处理不同API的响应格式
            let quoteData;
            if (usedEndpoint.includes('zenquotes')) {
                quoteData = {
                    content: data[0].q,
                    author: data[0].a
                };
            } else {
                quoteData = {
                    content: data.content,
                    author: data.author
                };
            }
            
            // 生成中文翻译（使用你现有的翻译函数）
            const chineseTranslation = simpleTranslate(quoteData.content);
            
            // 保持原有的显示格式
            quoteContainer.innerHTML = `
                <div class="quote-en">"${quoteData.content}"</div>
                <div class="quote-cn">${chineseTranslation}</div>
                <div class="author">— ${quoteData.author}</div>
            `;
            
        } else {
            // 所有API都失败，使用备用数据
            throw new Error('所有API调用均失败');
        }
        
    } catch (error) {
        console.log('API调用失败，使用备用数据:', error.message);
        clearTimeout(timeoutId);
        
        // 使用备用数据
        const randomIndex = Math.floor(Math.random() * fallbackQuotes.length);
        const fallback = fallbackQuotes[randomIndex];
        
        quoteContainer.innerHTML = `
            <div class="quote-en">"${fallback.content}"</div>
            <div class="quote-cn">${fallback.translation}</div>
            <div class="author">— ${fallback.author}</div>
            <div style="color: #888; font-size: 0.8em; margin-top: 10px;">（使用备用数据）</div>
        `;
    } finally {
        // 保持原有的按钮状态恢复
        newQuoteBtn.disabled = false;
        newQuoteBtn.textContent = '🔄 获取新名言';
    }
    }

    // 复制到剪贴板函数
    async function copyToClipboard() {
        const quoteEn = document.querySelector('.quote-en');
        const quoteCn = document.querySelector('.quote-cn');
        const author = document.querySelector('.author');
        
        if (!quoteEn) {
            alert('请先获取一条名言');
            return;
        }
        
        const textToCopy = `${quoteEn.textContent}\n${quoteCn.textContent}\n${author.textContent}`;
        
        try {
            await navigator.clipboard.writeText(textToCopy);
            
            // 显示复制成功提示
            const copyBtn = document.getElementById('copyBtn');
            const originalText = copyBtn.textContent;
            copyBtn.textContent = '✅ 已复制!';
            copyBtn.style.background = '#27ae60';
            
            setTimeout(() => {
                copyBtn.textContent = originalText;
                copyBtn.style.background = '';
            }, 2000);
            
        } catch (error) {
            // 降级方案
            const textArea = document.createElement('textarea');
            textArea.value = textToCopy;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            
            alert('名言已复制到剪贴板！');
        }
    }

    // 键盘快捷键
    document.addEventListener('keydown', (event) => {
        if (event.code === 'Space' && !event.target.matches('input, textarea')) {
            event.preventDefault();
            getNewQuote();
        }
    });

    // 页面加载时自动获取名言
    document.addEventListener('DOMContentLoaded', getNewQuote);
