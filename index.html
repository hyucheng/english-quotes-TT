    .waterfall {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
    }

    .water-drop {
        position: absolute;
        width: 2px;
        background: linear-gradient(to bottom, rgba(255,255,255,0.8), rgba(255,255,255,0.2));
        border-radius: 50% 50% 0 0;
        animation: waterfall 3s linear infinite;
    }

    @keyframes waterfall {
        0% {
            transform: translateY(-50px) scaleY(0);
            opacity: 0;
        }
        10% {
            opacity: 1;
        }
        90% {
            opacity: 1;
        }
        100% {
            transform: translateY(100vh) scaleY(1);
            opacity: 0;
        }

    .container {
        background: white;
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        max-width: 600px;
        width: 100%;
        text-align: center;
    }

    h1 {
        color: #333;
        margin-bottom: 30px;
        font-size: 2.2em;
        font-weight: 300;
    }

    .quote-container {
        margin: 30px 0;
        min-height: 200px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .quote-en {
        font-size: 1.4em;
        line-height: 1.6;
        color: #333;
        margin-bottom: 20px;
        font-style: italic;
        quotes: "“" "”" "‘" "’";
    }

    .quote-en::before {
        content: open-quote;
        font-size: 1.5em;
        color: #667eea;
    }

    .quote-en::after {
        content: close-quote;
        font-size: 1.5em;
        color: #667eea;
    }

    .quote-cn {
        font-size: 1.1em;
        line-height: 1.5;
        color: #fff;
        border-left: 3px solid #667eea;
        padding-left: 15px;
        margin-top: 15px;
        text-align: left;
    }

    .author {
        margin-top: 20px;
        color: #fff;
        font-size: 0.9em;
        font-style: italic;
    }

    .buttons {
        display: flex;
        gap: 15px;
        justify-content: center;
        margin-top: 30px;
        flex-wrap: wrap;
    }

    button {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: 25px;
        cursor: pointer;
        font-size: 1em;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }

    button:active {
        transform: translateY(0);
    }

    .loading {
        color: #667eea;
        font-size: 1.2em;
    }

    .error {
        color: #e74c3c;
        background: #ffeaea;
        padding: 15px;
        border-radius: 10px;
        margin: 20px 0;
    }

    .copy-btn {
        background: #27ae60;
    }

    .copy-btn:hover {
        background: #219a52;
    }

    @media (max-width: 768px) {
        .container {
            padding: 30px 20px;
            margin: 10px;
        }

        h1 {
            font-size: 1.8em;
        }

        .quote-en {
            font-size: 1.2em;
        }

        .buttons {
            flex-direction: column;
            align-items: center;
        }

        button {
            width: 100%;
            max-width: 200px;
        }
    }

    .fade-in {
        animation: fadeIn 0.5s ease-in;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>

    // 简单的翻译函数
    function simpleTranslate(text) {
        const words = text.toLowerCase().split(/\s+/);
        const translatedWords = words.map(word => {
            // 移除标点符号
            const cleanWord = word.replace(/[.,!?;:"]/g, '');
            return translationDict[cleanWord] || word;
        });
        return translatedWords.join(' ');
    }

    // 获取名言函数
    async function getNewQuote() {
        const quoteContainer = document.getElementById('quoteContainer');
        const newQuoteBtn = document.getElementById('newQuoteBtn');
        
        // 显示加载状态
        quoteContainer.innerHTML = '<div class="loading">正在加载名言...</div>';
        newQuoteBtn.disabled = true;
        newQuoteBtn.textContent = '加载中...';

        try {
            // 调用 Quotable API
            const response = await fetch('https://api.quotable.io/random');
            
            if (!response.ok) {
                throw new Error('网络请求失败');
            }
            
            const data = await response.json();
            
            // 生成简单的中文翻译
            const chineseTranslation = simpleTranslate(data.content);
            
            // 显示名言
            quoteContainer.innerHTML = `
                <div class="quote-en fade-in">${data.content}</div>
                <div class="quote-cn fade-in">${chineseTranslation}</div>
                <div class="author fade-in">— ${data.author}</div>
            `;
            
        } catch (error) {
            console.error('获取名言失败:', error);
            quoteContainer.innerHTML = `
                <div class="error">
                    获取名言失败，请检查网络连接后重试。<br>
                    错误信息: ${error.message}
                </div>
            `;
        } finally {
            newQuoteBtn.disabled = false;
            newQuoteBtn.textContent = '🔄 获取新名言';
        }
    }

    // 复制到剪贴板函数
    async function copyToClipboard() {
        const quoteEn = document.querySelector('.quote-en');
        const quoteCn = document.querySelector('.quote-cn');
        const author = document.querySelector('.author');
        
        if (!quoteEn) {
            alert('请先获取一条名言');
            return;
        }
        
        const textToCopy = `${quoteEn.textContent}\n${quoteCn.textContent}\n${author.textContent}`;
        
        try {
            await navigator.clipboard.writeText(textToCopy);
            
            // 显示复制成功提示
            const copyBtn = document.getElementById('copyBtn');
            const originalText = copyBtn.textContent;
            copyBtn.textContent = '✅ 已复制!';
            copyBtn.style.background = '#27ae60';
            
            setTimeout(() => {
                copyBtn.textContent = originalText;
                copyBtn.style.background = '';
            }, 2000);
            
        } catch (error) {
            // 降级方案
            const textArea = document.createElement('textarea');
            textArea.value = textToCopy;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            
            alert('名言已复制到剪贴板！');
        }
    }

    // 键盘快捷键
    document.addEventListener('keydown', (event) => {
        if (event.code === 'Space' && !event.target.matches('input, textarea')) {
            event.preventDefault();
            getNewQuote();
        }
    });

    // 页面加载时自动获取名言
    document.addEventListener('DOMContentLoaded', getNewQuote);
